# fly.toml app configuration file generated for luciq-ai-backend on 2025-06-24T22:55:43-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'luciq-ai-backend'
primary_region = 'sjc'

[build]

[processes]
  app = "uv run gunicorn api:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 1800 --graceful-timeout 600 --keep-alive 1800 --max-requests 0 --max-requests-jitter 0 --forwarded-allow-ips '*' --worker-connections 2000 --worker-tmp-dir /dev/shm --preload --log-level info --access-logfile - --error-logfile - --capture-output --enable-stdio-inheritance --threads 2"
  worker = "uv run dramatiq --skip-logging --processes 4 --threads 4 run_agent_background"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Environment variables for proper DNS resolution
[env]
  PYTHONUNBUFFERED = "1"
  # Enable new features from upstream
  ENABLE_AGENT_AGNOSTIC_THREADS = "true"
  ENABLE_PER_MESSAGE_AGENT_SELECTION = "true"

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
  processes = ['worker']
  [vm.health_check]
    type = "process"
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"
